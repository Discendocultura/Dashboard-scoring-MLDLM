<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
body{padding-bottom:calc(96px + env(safe-area-inset-bottom));}
.mldlm-wa{
  position:fixed; left:0; right:0; bottom:0; z-index:9999;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  width:100%; margin:0; box-sizing:border-box;
  padding:12px max(16px, calc((100% - 760px) / 2)) calc(12px + env(safe-area-inset-bottom));
  background:#ffffff; border-top:1px solid #e2d3c5; box-shadow:0 -8px 24px rgba(74,44,32,.10);
  font-family:'Lato',sans-serif; color:#3a2a24; text-decoration:none; cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  animation:mldlmWaEntra .7s cubic-bezier(.2,.8,.2,1) .4s both;
}
.mldlm-wa:not([href]){pointer-events:none;}
.mldlm-wa *,.mldlm-wa *::before,.mldlm-wa *::after{box-sizing:border-box;}
.mldlm-wa:focus{outline:none;}
.mldlm-wa:focus-visible{outline:3px solid #860d0e; outline-offset:-3px;}
.mldlm-wa .mldlm-wa__texto{
  flex:1 1 auto; min-width:0; overflow:hidden;
  display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2;
  font-size:clamp(13px, 3.8vw, 15px); font-weight:900; line-height:1.3; color:#3a2a24; text-wrap:balance;
}
.mldlm-wa .mldlm-wa__btn{
  flex:none; display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:44px; padding:10px 18px; border-radius:999px;
  background:#25D366; color:#ffffff; font-size:15px; font-weight:900; line-height:1; white-space:nowrap;
  box-shadow:0 4px 12px rgba(37,211,102,.35);
  transition:background-color .2s ease, transform .2s ease;
  animation:mldlmWaPulso 4.5s ease-out 1.5s infinite;
}
.mldlm-wa .mldlm-wa__btn svg{width:20px; height:20px; flex:none; fill:#ffffff;}
.mldlm-wa:hover .mldlm-wa__btn{background:#1ebe5a; transform:translateY(-1px);}
.mldlm-wa:focus-visible .mldlm-wa__btn{background:#1ebe5a;}
@keyframes mldlmWaEntra{from{transform:translateY(110%);} to{transform:translateY(0);}}
@keyframes mldlmWaPulso{
  0%,70%{box-shadow:0 4px 12px rgba(37,211,102,.35), 0 0 0 0 rgba(37,211,102,.45);}
  85%{box-shadow:0 4px 12px rgba(37,211,102,.35), 0 0 0 12px rgba(37,211,102,0);}
  100%{box-shadow:0 4px 12px rgba(37,211,102,.35), 0 0 0 0 rgba(37,211,102,0);}
}
@media (max-width:359px){
  .mldlm-wa{gap:10px; padding-left:12px; padding-right:12px;}
  .mldlm-wa .mldlm-wa__texto{font-size:12.5px;}
  .mldlm-wa .mldlm-wa__btn{padding:10px 14px; gap:6px; font-size:14px;}
}
@media (min-width:768px){
  .mldlm-wa{padding-top:14px; padding-bottom:calc(14px + env(safe-area-inset-bottom)); gap:20px;}
  .mldlm-wa .mldlm-wa__texto{font-size:17px; display:block; white-space:nowrap; text-overflow:ellipsis;}
  .mldlm-wa .mldlm-wa__btn{min-height:48px; padding:12px 24px; font-size:16px;}
}
@media (prefers-reduced-motion:reduce){
  .mldlm-wa,.mldlm-wa .mldlm-wa__btn{animation:none !important; transition:none !important;}
}
</style>
