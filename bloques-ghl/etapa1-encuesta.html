<!-- BLOQUE · ETAPA 1: ENCUESTA · Página de recursos · Me lo dijo la matrona -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
.mldlm-paso1{
  --mldlm-burdeos:#860d0e; --mldlm-boton:#c49b79; --mldlm-pastel:#f0e4da;
  --mldlm-texto:#3a2a24; --mldlm-linea:#e2d3c5; --mldlm-marron:#4a2c20;
  background:var(--mldlm-pastel); font-family:'Lato',sans-serif; color:var(--mldlm-texto);
  padding:64px 20px 0; box-sizing:border-box; width:100%; margin:0; overflow:hidden;
}
.mldlm-paso1 *,.mldlm-paso1 *::before,.mldlm-paso1 *::after{box-sizing:border-box;}
.mldlm-paso1 .mldlm-e1__inner{max-width:600px; margin:0 auto; text-align:center;}

/* ===== Tarjeta de la etapa ===== */
.mldlm-paso1 .mldlm-e1__card{position:relative; background:#ffffff; border:1px solid var(--mldlm-linea); border-radius:20px; box-shadow:0 14px 40px rgba(134,13,14,.10); animation:mldlmE1Entra .8s cubic-bezier(.2,.8,.2,1) both;}
@keyframes mldlmE1Entra{from{opacity:0; transform:translateY(22px);} to{opacity:1; transform:none;}}

/* Mojón jacobeo con el número */
.mldlm-paso1 .mldlm-e1__mojon{position:absolute; top:-34px; left:50%; width:62px; transform:translateX(-50%); z-index:3; filter:drop-shadow(0 6px 10px rgba(74,44,32,.22)); animation:mldlmE1Mojon 3.2s ease-in-out infinite;}
.mldlm-paso1 .mldlm-e1__mojon svg{display:block; width:100%; height:auto;}
@keyframes mldlmE1Mojon{0%,100%{transform:translateX(-50%) translateY(0);} 50%{transform:translateX(-50%) translateY(-5px);}}

/* Paisaje con el camino */
.mldlm-paso1 .mldlm-e1__paisaje{position:relative; height:150px; border-radius:20px 20px 0 0; overflow:hidden; background:linear-gradient(180deg,#fbf6f1 0%,#f6ebe1 100%);}
.mldlm-paso1 .mldlm-e1__paisaje svg{position:absolute; inset:0; width:100%; height:100%;}
.mldlm-paso1 .mldlm-e1__sol{transform-origin:470px 46px; animation:mldlmE1Sol 5s ease-in-out infinite;}
@keyframes mldlmE1Sol{0%,100%{opacity:.55; transform:scale(1);} 50%{opacity:.85; transform:scale(1.08);}}
.mldlm-paso1 .mldlm-e1__nube{animation:mldlmE1Nube 26s linear infinite;}
.mldlm-paso1 .mldlm-e1__nube--2{animation-duration:38s; animation-delay:-14s;}
@keyframes mldlmE1Nube{from{transform:translateX(-160px);} to{transform:translateX(760px);}}
.mldlm-paso1 .mldlm-e1__trazo{stroke-dasharray:3 11; animation:mldlmE1Marcha 1.1s linear infinite;}
@keyframes mldlmE1Marcha{to{stroke-dashoffset:-14;}}
.mldlm-paso1 .mldlm-e1__cipres{transform-box:fill-box; transform-origin:50% 100%; animation:mldlmE1Viento 4s ease-in-out infinite;}
.mldlm-paso1 .mldlm-e1__cipres--b{animation-delay:-1.6s;}
@keyframes mldlmE1Viento{0%,100%{transform:rotate(0);} 50%{transform:rotate(2.5deg);}}

/* Contenido */
.mldlm-paso1 .mldlm-e1__cuerpo{padding:22px 20px 30px;}
.mldlm-paso1 .mldlm-e1__etiqueta{display:flex; width:fit-content; align-items:center; gap:8px; margin:0 auto 12px; font-size:15px; font-weight:900; letter-spacing:.03em; line-height:1.3; color:var(--mldlm-burdeos);}
.mldlm-paso1 .mldlm-e1__etiqueta svg{width:18px; height:18px;}
.mldlm-paso1 .mldlm-e1__titulo{margin:0 0 16px; font-family:'Lato',sans-serif; font-size:25px; font-weight:900; line-height:1.24; letter-spacing:-.01em; color:var(--mldlm-marron);}
.mldlm-paso1 .mldlm-e1__titulo strong{font-weight:900; color:var(--mldlm-burdeos); white-space:nowrap;}
.mldlm-paso1 .mldlm-e1__chip{display:flex; width:fit-content; align-items:center; gap:6px; margin:0 auto 24px; padding:6px 14px; border-radius:999px; background:var(--mldlm-pastel); border:1px solid var(--mldlm-linea); font-size:14px; font-weight:700; line-height:1.2; color:var(--mldlm-texto);}
.mldlm-paso1 .mldlm-e1__chip svg{width:16px; height:16px; flex:none; color:var(--mldlm-burdeos);}
.mldlm-paso1 .mldlm-e1__chip svg .aguja{transform-origin:12px 12px; animation:mldlmE1Aguja 4s linear infinite;}
@keyframes mldlmE1Aguja{to{transform:rotate(360deg);}}

/* Botón */
.mldlm-paso1 .mldlm-e1__btn{position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; gap:10px; width:100%; min-height:56px; padding:14px 24px; font-family:'Lato',sans-serif; font-size:17px; font-weight:900; line-height:1.2; color:var(--mldlm-texto); background:var(--mldlm-boton); border-radius:999px; text-decoration:none; cursor:pointer; box-shadow:0 6px 18px rgba(196,155,121,.5); transition:background-color .25s ease,color .25s ease,transform .25s ease; animation:mldlmE1Llama 2.6s ease-in-out infinite;}
.mldlm-paso1 .mldlm-e1__btn::after{content:""; position:absolute; top:0; bottom:0; left:-60%; width:40%; background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent); transform:skewX(-20deg); animation:mldlmE1Brillo 3.4s ease-in-out infinite;}
.mldlm-paso1 .mldlm-e1__btn svg{width:20px; height:20px; flex:none; transition:transform .3s ease;}
.mldlm-paso1 .mldlm-e1__btn:hover{background:var(--mldlm-burdeos); color:#ffffff; transform:translateY(-2px);}
.mldlm-paso1 .mldlm-e1__btn:hover svg{transform:translateX(4px);}
.mldlm-paso1 .mldlm-e1__btn:focus-visible{outline:3px solid var(--mldlm-burdeos); outline-offset:3px;}
@keyframes mldlmE1Brillo{0%,55%{left:-60%;} 100%{left:130%;}}
@keyframes mldlmE1Llama{0%,100%{box-shadow:0 6px 18px rgba(196,155,121,.5),0 0 0 0 rgba(196,155,121,.45);} 50%{box-shadow:0 6px 18px rgba(196,155,121,.5),0 0 0 10px rgba(196,155,121,0);}}
.mldlm-paso1 .mldlm-e1__micro{margin:14px auto 0; max-width:26em; font-size:14px; line-height:1.5; color:#6b5448;}

/* ===== Etapa completada: sello de la credencial ===== */
.mldlm-paso1 .mldlm-e1__hecho{display:flex; align-items:center; gap:16px; text-align:left; background:#ffffff; border:1px solid var(--mldlm-linea); border-radius:16px; padding:14px 18px 14px 14px; box-shadow:0 8px 24px rgba(134,13,14,.07);}
.mldlm-paso1 .mldlm-e1__sello{flex:none; width:68px; height:68px; animation:mldlmE1Sellar .9s cubic-bezier(.3,1.6,.5,1) both .2s;}
.mldlm-paso1 .mldlm-e1__sello svg{display:block; width:100%; height:100%;}
.mldlm-paso1 .mldlm-e1__sello .giro{transform-origin:50px 50px; animation:mldlmE1Giro 18s linear infinite;}
@keyframes mldlmE1Sellar{0%{opacity:0; transform:scale(1.8) rotate(-30deg);} 60%{opacity:1;} 100%{opacity:1; transform:scale(1) rotate(-10deg);}}
@keyframes mldlmE1Giro{to{transform:rotate(360deg);}}
.mldlm-paso1 .mldlm-e1__hecho-etq{margin:0 0 3px; font-size:14px; font-weight:900; letter-spacing:.03em; line-height:1.3; color:var(--mldlm-burdeos);}
.mldlm-paso1 .mldlm-e1__hecho-txt{margin:0; font-size:15px; line-height:1.45; color:var(--mldlm-texto);}

/* ===== Camino hacia la etapa 2 ===== */
.mldlm-paso1 .mldlm-e1__sendero{display:block; width:120px; height:130px; margin:6px auto 0;}
.mldlm-paso1 .mldlm-e1__sendero .mldlm-e1__trazo{stroke-dasharray:2 12; animation-duration:1s;}
.mldlm-paso1 .mldlm-e1__concha{transform-box:fill-box; transform-origin:50% 50%; animation:mldlmE1Bota 2s ease-in-out infinite;}
@keyframes mldlmE1Bota{0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);}}

@media (min-width:768px){
  .mldlm-paso1{padding:96px 24px 0;}
  .mldlm-paso1 .mldlm-e1__mojon{width:70px; top:-40px;}
  .mldlm-paso1 .mldlm-e1__paisaje{height:180px;}
  .mldlm-paso1 .mldlm-e1__cuerpo{padding:26px 48px 38px;}
  .mldlm-paso1 .mldlm-e1__titulo{font-size:31px;}
  .mldlm-paso1 .mldlm-e1__btn{display:inline-flex; width:auto; min-width:340px;}
  .mldlm-paso1 .mldlm-e1__hecho{padding:16px 24px 16px 16px;}
  .mldlm-paso1 .mldlm-e1__hecho-txt{font-size:16px;}
}
@media (prefers-reduced-motion:reduce){
  .mldlm-paso1 *,.mldlm-paso1 *::after{animation:none !important; transition:none !important;}
  .mldlm-paso1 .mldlm-e1__peregrina{visibility:hidden;}
}
</style>
