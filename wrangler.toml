# Cloudflare Pages: los estáticos salen de public/ y la API de functions/ (no hay paso de compilación).
name = "lead-scoring-dashboard"
pages_build_output_dir = "public"
compatibility_date = "2026-09-01"
# AsyncLocalStorage: cada petición sabe de qué cliente es (varios clientes en el mismo dashboard).
compatibility_flags = ["nodejs_als"]
